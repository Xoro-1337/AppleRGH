name: Build Watch360 (watchOS & AltStore IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package AltStore IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Run Core Unit Tests
        run: |
          swift test

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' Watch360.xcodeproj/project.pbxproj

      - name: Build & Archive for AltStore & Sideloadly
        run: |
          xcodebuild archive \
            -project Watch360.xcodeproj \
            -scheme Watch360iOS \
            -destination "generic/platform=iOS" \
            -archivePath "$(pwd)/build/Watch360.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Watch360.ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Watch360.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -r Watch360.ipa Payload
          ls -lh Watch360.ipa

      - name: Upload AltStore IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watch360-AltStore-IPA
          path: build/Watch360.ipa
