name: Build Watch360 (watchOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test on macOS Runner
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Run Core Unit Tests
        run: |
          swift test

      - name: Install XcodeGen & Generate Project
        run: |
          brew install xcodegen
          xcodegen generate
          # Fix objectVersion so Xcode 15.x / 16.x can open it without "future format (77)" error
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' Watch360.xcodeproj/project.pbxproj

      - name: List Available Destinations
        run: |
          xcodebuild -project Watch360.xcodeproj -scheme Watch360 -showdestinations

      - name: Build watchOS Simulator App
        run: |
          xcodebuild build \
            -project Watch360.xcodeproj \
            -scheme Watch360 \
            -destination "generic/platform=watchOS Simulator" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive watchOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Watch360-watchOS-Build
          path: |
            build/
            Watch360.xcodeproj
